name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --extra lint

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyrefly check
        run: uv run pyrefly check

  test:
    name: Test (Python 3.8 & 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        # Ubuntu headless 环境无 X11/XCB/GL 系统库，创建 QGuiApplication + QQmlApplicationEngine
        # 的 QML 集成测试会 SIGABRT（exit 134），故跳过 gui_qml 标记测试
        # （test_gui_launch / test_gui_qml_scan_progress），由 Windows 开发机本地覆盖。
        # gui 单元测试（controller/model 逻辑，不创建 QGuiApplication）仍正常运行。
        run: uv run pytest -m "not slow and not gui_qml" --cov=fuscan --cov-fail-under=90 --cov-report=term-missing
