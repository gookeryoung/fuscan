name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # iter-120：手动触发 benchmark 回归对比（slow 测试 CI 默认跳过）
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: 运行 benchmark 回归测试
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --extra lint

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyrefly check
        run: uv run pyrefly check

  test:
    name: Test (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -m "not slow and not gui_qml" --cov=fuscan --cov-fail-under=95 --cov-report=term-missing --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.xml
          retention-days: 14

  # iter-120：benchmark 回归测试 job
  # 仅手动触发（workflow_dispatch）时运行，CI 默认跳过 slow 测试
  # 用于对比性能基线，检测回归
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --frozen --extra test --python 3.10

      - name: Run benchmark tests
        # 运行 perf benchmark 测试，生成 JSON 报告供对比
        # 首次运行：--benchmark-save=baseline 建立基线
        # 后续运行：--benchmark-compare=baseline 对比回归
        run: uv run pytest -m slow tests/test_perf_benchmark.py --benchmark-only --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30
