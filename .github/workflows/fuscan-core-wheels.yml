name: fuscan-core wheels

# 构建 fuscan-core（Rust + PyO3 原生匹配引擎）的多平台 wheel。
#
# 触发：
#   - push 到 main/develop（仅 packages/fuscan-core/ 或本 workflow 变更时）：构建验证
#   - PR 到 main/develop（同上 paths 过滤）：构建验证
#   - tag fuscan-core-v*.*.*：构建 + 发布到 PyPI（OIDC trusted publisher）
#   - workflow_dispatch：手动触发构建验证
#
# fuscan-core 是独立 PyPI 包（版本独立于 fuscan 主包），位于 packages/fuscan-core/。
# monorepo 布局：用 maturin-action 的 working-directory 在子目录运行 maturin。
#
# 发布前置条件（仅 tag 触发时需要）：
#   - PyPI 项目 fuscan-core 配置 GitHub Actions OIDC trusted publisher
#     （owner=gookeryoung/fuscan, workflow=fuscan-core-wheels.yml, environment=pypi）
#   - 或在 repository secrets 配置 PYPI_API_TOKEN，改用 token 发布
#
# iter-03：替代 packages/fuscan-core/.github/workflows/CI.yml（maturin 自动生成，
# 但位于子目录不会被 GitHub Actions 识别）。

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/fuscan-core/**'
      - '.github/workflows/fuscan-core-wheels.yml'
    tags: ['fuscan-core-v*.*.*']
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/fuscan-core/**'
      - '.github/workflows/fuscan-core-wheels.yml'
  workflow_dispatch:

concurrency:
  group: fuscan-core-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux：manylinux auto 覆盖 glibc 主流发行版
          - os: linux
            runner: ubuntu-22.04
            target: x86_64
          - os: linux
            runner: ubuntu-22.04
            target: aarch64
          # Windows：x64，用 win7 target + nightly -Z build-std 重建 std，
          # 使 .pyd 在 Win7 SP1 及更新版本均可加载（stable std 硬引用 Win8+ API）。
          # 跨编译器兼容：win7 target 构建物在 Win8/10/11 同样运行，无功能损失。
          # build_std 标志：win7 target 是 Tier-3，rustup target add 无预编译 artifacts，
          # 不能通过 maturin-action 的 target 输入传递（会触发 rustup target add 失败），
          # 改用 args 传递 --target 给 maturin，cargo 通过 build-std 从 rust-src 源码构建。
          - os: windows
            runner: windows-latest
            target: x86_64-win7-windows-msvc
            build_std: true
          # macOS：Intel + Apple Silicon
          - os: macos
            runner: macos-13
            target: x86_64
          - os: macos
            runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v5

      # abi3-py310 模式：构建单一 wheel 覆盖 Python 3.10+，无需为每个版本各构建。
      # 仍需一个 Python 解释器供 maturin/pyo3 build-time 检测，装 3.10 即可。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # win7 target 是 Tier-3，无预编译 std，需 nightly -Z build-std 重建 std。
      # rust-toolchain.toml 已声明 nightly + rust-src（build-std 必需），
      # maturin-action 读取该文件自动安装工具链与组件，无需手动 rustup install。
      # 仅 Windows 设置 CARGO_UNSTABLE_BUILD_STD；空字符串会误启用 build-std，
      # 用 if 条件确保非 Windows 平台完全不设置该环境变量。
      - name: Configure build-std env (Windows win7 only)
        if: matrix.platform.build_std
        shell: bash
        run: echo "CARGO_UNSTABLE_BUILD_STD=std,panic_abort" >> $GITHUB_ENV

      # Windows win7 build-std 构建：不设 target 输入（避免 maturin-action 执行
      # rustup target add x86_64-win7-windows-msvc，Tier-3 无预编译 artifacts 必失败），
      # 通过 args 传递 --target 给 maturin，cargo 用 CARGO_UNSTABLE_BUILD_STD +
      # rust-src 从源码构建 std。manylinux 仅 Linux 生效，此处省略。
      - name: Build wheels (Windows win7 build-std)
        if: matrix.platform.build_std
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/fuscan-core
          args: --release --out dist --find-interpreter --target ${{ matrix.platform.target }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # 标准目标构建：target 输入触发 rustup target add（Tier-1/2 有预编译 artifacts），
      # maturin-action 自动安装对应 target。
      - name: Build wheels (standard targets)
        if: ${{ !matrix.platform.build_std }}
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/fuscan-core
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: fuscan-core-wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: packages/fuscan-core/dist
          retention-days: 7
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/fuscan-core
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: fuscan-core-sdist
          path: packages/fuscan-core/dist
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/fuscan-core-v')
    needs: [build, sdist]
    environment: pypi
    timeout-minutes: 10
    permissions:
      # OIDC trusted publisher 发布需要 id-token: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      # OIDC trusted publisher：无需 API token，由 PyPI 验证 GitHub OIDC
      # 前置：在 PyPI 项目 fuscan-core 配置 trusted publisher
      - name: Publish to PyPI (OIDC)
        run: uv publish dist/
