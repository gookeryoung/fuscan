name: fuscan-core wheels

# 构建 fuscan-core（Rust + PyO3 原生匹配引擎）的多平台 wheel。
#
# 触发：
#   - push 到 main/develop（仅 packages/fuscan-core/ 或本 workflow 变更时）：构建验证
#   - PR 到 main/develop（同上 paths 过滤）：构建验证
#   - tag fuscan-core-v*.*.*：构建 + 发布到 PyPI（OIDC trusted publisher）+ GitHub Release
#   - workflow_dispatch：手动触发构建验证
#
# fuscan-core 是独立 PyPI 包（版本独立于 fuscan 主包），位于 packages/fuscan-core/。
# monorepo 布局：用 maturin-action 的 working-directory 在子目录运行 maturin。
# 版本管理：make bump-core [patch|minor|major]（bump-my-version 管理 Cargo.toml version）。
#
# 发布前置条件（仅 tag 触发时需要）：
#   - PyPI 项目 fuscan-core 配置 GitHub Actions OIDC trusted publisher
#     （owner=gookeryoung/fuscan, workflow=fuscan-core-wheels.yml, environment=pypi）
#   - 或在 repository secrets 配置 PYPI_API_TOKEN，改用 token 发布
#
# iter-03：替代 packages/fuscan-core/.github/workflows/CI.yml（maturin 自动生成，
# 但位于子目录不会被 GitHub Actions 识别）。

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/fuscan-core/**'
      - '.github/workflows/fuscan-core-wheels.yml'
    tags: ['fuscan-core-v*.*.*']
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/fuscan-core/**'
      - '.github/workflows/fuscan-core-wheels.yml'
  workflow_dispatch:

concurrency:
  group: fuscan-core-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux：manylinux auto 覆盖 glibc 主流发行版
          - os: linux
            runner: ubuntu-22.04
            target: x86_64
          - os: linux
            runner: ubuntu-22.04
            target: aarch64
          # Windows：x64，用 win7 target + nightly -Z build-std 重建 std，
          # 使 .pyd 在 Win7 SP1 及更新版本均可加载（stable std 硬引用 Win8+ API）。
          # 跨编译器兼容：win7 target 构建物在 Win8/10/11 同样运行，无功能损失。
          # build_std 标志：win7 target 是 Tier-3，rustup target add 无预编译 artifacts，
          # 不能通过 maturin-action 的 target 输入传递（会触发 rustup target add 失败），
          # 改用 args 传递 --target 给 maturin，cargo 通过 build-std 从 rust-src 源码构建。
          - os: windows
            runner: windows-latest
            target: x86_64-win7-windows-msvc
            build_std: true
          # macOS：Intel + Apple Silicon。
          # 两个 target 均在 macos-14（Apple Silicon）上构建：
          # aarch64 native 编译；x86_64 交叉编译（x86_64-apple-darwin 是 Tier-2，
          # rustup 有预编译 std）。macos-13（Intel runner）已逐步停用，排队时间极长。
          # abi3 模式不绑定具体 Python 版本，交叉编译无需目标平台 Python。
          - os: macos
            runner: macos-14
            target: x86_64
          - os: macos
            runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v5

      # abi3-py310 模式：构建单一 wheel 覆盖 Python 3.10+，无需为每个版本各构建。
      # 仍需一个 Python 解释器供 maturin/pyo3 build-time 检测，装 3.10 即可。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Windows win7 build-std 构建：不用 maturin-action（其 getRustTarget 会从
      # args 解析 --target 并强制 rustup target add，Tier-3 target 无预编译 artifacts
      # 必失败），改用 maturin 命令 + 假 rustup.bat wrapper 拦截 `target add *win7*`。
      # wrapper 只跳过 win7 target 的 rustup target add（返回 exit 0），其他 rustup
      # 命令（install nightly / component add rust-src 等）转发真实 rustup.exe。
      # cargo 通过 CARGO_UNSTABLE_BUILD_STD + rust-src 从源码构建 std，不需要预编译 artifacts。
      - name: Build wheels (Windows win7 build-std)
        if: matrix.platform.build_std
        shell: bash
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: |
          # 创建假 rustup wrapper（.bat），跳过 win7 Tier-3 target 的 rustup target add。
          # 用 printf 确保 CRLF 换行（cmd.exe 要求 .bat 文件为 CRLF）。
          # wrapper 逻辑：若参数为 `target add` 且含 `win7`，echo 提示并 exit 0；
          # 否则转发给真实 rustup.exe（PATH 中 wrapper 目录无 rustup.exe，跳过递归）。
          mkdir -p /tmp/fake-rustup
          printf '@echo off\r\nif "%%~1"=="target" if "%%~2"=="add" (\r\n  echo %%* | findstr /C:"win7" >nul\r\n  if not errorlevel 1 (\r\n    echo skip rustup target add for win7 Tier-3 target\r\n    exit /b 0\r\n  )\r\n)\r\nrustup.exe %%*\r\n' > /tmp/fake-rustup/rustup.bat
          export PATH="/tmp/fake-rustup:$PATH"

          # 安装 maturin（不通过 maturin-action，避免其强制 rustup target add）
          pip install maturin

          cd packages/fuscan-core
          maturin build --release --out dist --find-interpreter --target x86_64-win7-windows-msvc

      # 标准目标构建：target 输入触发 rustup target add（Tier-1/2 有预编译 artifacts），
      # maturin-action 自动安装对应 target。
      - name: Build wheels (standard targets)
        if: ${{ !matrix.platform.build_std }}
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/fuscan-core
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: fuscan-core-wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: packages/fuscan-core/dist
          retention-days: 7
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/fuscan-core
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: fuscan-core-sdist
          path: packages/fuscan-core/dist
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI & GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/fuscan-core-v')
    needs: [build, sdist]
    environment: pypi
    timeout-minutes: 10
    permissions:
      # OIDC trusted publisher 发布需要 id-token: write
      id-token: write
      # GitHub Release 创建需要 contents: write
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      # OIDC trusted publisher：无需 API token，由 PyPI 验证 GitHub OIDC
      # 前置：在 PyPI 项目 fuscan-core 配置 trusted publisher
      #   （owner=gookeryoung/fuscan, workflow=fuscan-core-wheels.yml, environment=pypi）
      - name: Publish to PyPI (OIDC)
        run: uv publish dist/

      # 创建 GitHub Release 并上传 wheel/sdist 作为 assets，便于直接下载
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，上传产物（覆盖同名）"
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            echo "创建 Release $TAG_NAME"
            gh release create "$TAG_NAME" dist/* \
              --title "fuscan-core ${{ github.ref_name }}" \
              --generate-notes
          fi
