name: Release

# 触发：push v*.*.* tag
#
# 三个并行 job：
#   - pypi        : uv build → uv publish（OIDC）→ 上传 sdist/wheel artifact
#   - pack-windows: windows-latest 原生打包 fuscan 自身（mingw + NSIS）
#   - pack-linux   : ubuntu-latest  原生打包 fuscan 自身（gcc + dpkg-dev）
#
# release job 依赖以上三个 job，收集构建产物（exe/deb/tar.gz/zip）+
# PyPI 产物（whl/sdist），统一上传到 GitHub Release。
# 任一前置 job 失败时 release 仍尝试发布已成功产物，但最终标记 workflow 失败。
#
# iter-139：参考 fspack 项目工作流，将 fspack 原生打包融入 Release 流程。
# fuscan 是 PySide2+QML GUI 应用，打包用 Python 3.10（PySide2 兼容上限）。

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===== PyPI 发布 =====
  pypi:
    name: Build & Publish PyPI
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI (OIDC)
        run: uv publish

      - name: Upload sdist & wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pypi-dist
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # ===== Windows 原生打包（用 fspack 打包 fuscan 自身）=====
  pack-windows:
    name: Pack (Windows native)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # windows-2025 镜像移除了 NSIS；mingw-w64 提供 x86_64-w64-mingw32-gcc 前缀的交叉编译器。
      # 注意：windows-latest 默认 shell 是 pwsh，PowerShell 访问环境变量必须用 $env: 前缀，
      # 直接写 $GITHUB_PATH 会被当作 PowerShell 变量（值为 $null），PATH 不会写入文件，
      # 导致后续步骤找不到 makensis。Add-Content 在 pwsh 7 下默认 utf8NoBOM 编码安全。
      - name: Install NSIS & mingw-w64
        shell: pwsh
        run: |
          choco install nsis mingw -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\mingw-w64\mingw64\bin"

      - name: Install Python 3.10
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --frozen --python 3.10

      # fspack 不在 fuscan 依赖中，需单独安装到 venv。
      # fspack 的 download_wheels 用 `pip download` 拉 wheel，但 uv 管理的 venv 默认不含 pip，
      # 且 CI runner 上 PATH 中可能没有带 pip 的系统 python，故显式安装 pip 到 venv。
      # 临时从 GitHub main 安装：PyPI 0.3.18-0.3.26 的 .gitignore `wheels/` 规则误杀
      # src/fspack/packaging/wheels/ 子包（hatchling 尊重 .gitignore 排除），
      # stages.py 顶层 `from fspack.packaging.wheels import download_wheels` 抛 ModuleNotFoundError。
      # 已修复（.gitignore `wheels/` → `/wheels/` 限定根目录）并推送 main，
      # 待 fspack bump 版本发布 0.3.27 到 PyPI 后改回 `uv pip install fspack`。
      - name: Install fspack & pip
        run: uv pip install git+https://github.com/gookeryoung/fspack.git pip

      # fuscan-core 未发布到 PyPI，本地用 maturin 构建 wheel 到 fuscan-core-wheels/，
      # fspack 通过 [tool.fspack] find-links 从该目录解析 fuscan-core 依赖。
      # Windows 用 win7 target + nightly build-std 重建 std（Win7 SP1 兼容）。
      - name: Setup Rust (nightly + rust-src for win7 build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build fuscan-core wheel (Windows win7)
        shell: bash
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
        run: |
          # 假 rustup wrapper：跳过 win7 Tier-3 target 的 rustup target add
          # （无预编译 artifacts，cargo 通过 build-std 从 rust-src 源码构建）
          mkdir -p /tmp/fake-rustup
          printf '@echo off\r\nif "%%~1"=="target" if "%%~2"=="add" (\r\n  echo %%* | findstr /C:"win7" >nul\r\n  if not errorlevel 1 (\r\n    echo skip rustup target add for win7 Tier-3 target\r\n    exit /b 0\r\n  )\r\n)\r\nrustup.exe %%*\r\n' > /tmp/fake-rustup/rustup.bat
          export PATH="/tmp/fake-rustup:$PATH"
          pip install maturin
          mkdir -p fuscan-core-wheels
          cd packages/fuscan-core
          maturin build --release --out ../../fuscan-core-wheels --find-interpreter --target x86_64-win7-windows-msvc

      - name: Cache fspack assets
        uses: actions/cache@v5
        with:
          path: ~/.fspack/cache/
          key: fuscan-windows-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            fuscan-windows-
            fuscan-

      # OCR 模型 gitignored，下载真实模型替换占位文件；
      # fspack 通过 [tool.fspack] data-dirs 将模型打入便携包
      - name: Download OCR models
        run: uv run python scripts/download_ocr_models.py

      - name: Build fuscan with fspack
        env:
          PYTHONIOENCODING: utf-8
        run: uv run fspack b . --target windows

      - name: Generate installer
        env:
          PYTHONIOENCODING: utf-8
        run: uv run fspack p . --target windows --format all --no-build

      # fuscan 是 GUI 应用，CI 无显示器无法做运行时 smoke test，仅校验产物存在
      # + OCR 模型/依赖已打入便携包（确保 fspack 打包版本含 OCR）
      - name: Assert artifacts
        shell: bash
        run: |
          test -f dist/release/fuscan-*-windows-*-setup.exe
          test -f dist/release/fuscan-*-windows-*.zip
          zip_path=$(ls dist/release/fuscan-*-windows-*.zip)
          for needle in ch_PP-OCRv4_det_mobile.onnx rapidocr onnxruntime; do
            unzip -l "$zip_path" | grep -q "$needle" \
              || { echo "::error::fspack 便携包缺失 $needle"; exit 1; }
          done
          echo "fspack 便携包含 OCR 模型与依赖"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pack-windows-failure
          path: dist/
          retention-days: 3

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  # ===== Linux 原生打包（用 fspack 打包 fuscan 自身）=====
  pack-linux:
    name: Pack (Linux native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc dpkg-dev

      - name: Install Python 3.10
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --frozen --python 3.10

      # fspack 不在 fuscan 依赖中，需单独安装到 venv。
      # fspack 的 download_wheels 用 `pip download` 拉 wheel，但 uv 管理的 venv 默认不含 pip，
      # 且 CI runner 上 PATH 中可能没有带 pip 的系统 python，故显式安装 pip 到 venv。
      # 临时从 GitHub main 安装：PyPI 0.3.18-0.3.26 的 .gitignore `wheels/` 规则误杀
      # src/fspack/packaging/wheels/ 子包（hatchling 尊重 .gitignore 排除），
      # stages.py 顶层 `from fspack.packaging.wheels import download_wheels` 抛 ModuleNotFoundError。
      # 已修复（.gitignore `wheels/` → `/wheels/` 限定根目录）并推送 main，
      # 待 fspack bump 版本发布 0.3.27 到 PyPI 后改回 `uv pip install fspack`。
      - name: Install fspack & pip
        run: uv pip install git+https://github.com/gookeryoung/fspack.git pip

      # fuscan-core 未发布到 PyPI，本地用 maturin-action 构建 manylinux wheel 到
      # fuscan-core-wheels/，fspack 通过 [tool.fspack] find-links 从该目录解析依赖。
      # 必须 manylinux 容器构建：直接 maturin build 生成 linux_x86_64 平台标签，
      # fspack 的 pip download 要求 --platform manylinux2014_x86_64 / manylinux_2_28_x86_64，
      # linux_x86_64 wheel 不匹配会导致 "No matching distribution" 失败。
      - name: Build fuscan-core wheel (Linux manylinux)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/fuscan-core
          args: --release --out dist --find-interpreter
          manylinux: auto

      - name: Copy fuscan-core wheel to find-links directory
        run: |
          mkdir -p fuscan-core-wheels
          cp packages/fuscan-core/dist/*.whl fuscan-core-wheels/

      - name: Cache fspack assets
        uses: actions/cache@v5
        with:
          path: ~/.fspack/cache/
          key: fuscan-linux-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            fuscan-linux-
            fuscan-

      # OCR 模型 gitignored，下载真实模型替换占位文件；
      # fspack 通过 [tool.fspack] data-dirs 将模型打入便携包
      - name: Download OCR models
        run: uv run python scripts/download_ocr_models.py

      - name: Build fuscan with fspack
        run: uv run fspack b . --target linux

      - name: Generate installer
        run: uv run fspack p . --target linux --format all --no-build

      # fuscan 是 GUI 应用，CI 无显示器无法做运行时 smoke test，仅校验产物存在
      # + OCR 模型/依赖已打入便携包（确保 fspack 打包版本含 OCR）
      - name: Assert artifacts
        run: |
          test -f dist/release/fuscan-*-linux-*.tar.gz
          test -f dist/release/fuscan_*-slim_amd64.deb
          test -f dist/release/fuscan-*-linux-*.zip
          zip_path=$(ls dist/release/fuscan-*-linux-*.zip)
          for needle in ch_PP-OCRv4_det_mobile.onnx rapidocr onnxruntime; do
            unzip -l "$zip_path" | grep -q "$needle" \
              || { echo "::error::fspack 便携包缺失 $needle"; exit 1; }
          done
          echo "fspack 便携包含 OCR 模型与依赖"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pack-linux-failure
          path: dist/
          retention-days: 3

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  # ===== 收集产物并上传到 GitHub Release =====
  release:
    name: Upload to GitHub Release
    needs: [pypi, pack-windows, pack-linux]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets/

      - name: Collect release files
        run: |
          mkdir -p release-files/
          # 构建产物（exe/deb/tar.gz/zip）+ PyPI 产物（whl/sdist）
          # sdist 也是 .tar.gz，但命名 fuscan-<version>.tar.gz 不与 Linux 便携包冲突
          find release-assets/ -type f \
            \( -name "*.exe" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" \) \
            -exec cp {} release-files/ \;
          echo "::group::Release files"
          ls -la release-files/
          echo "::endgroup::"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        # 幂等：release 已存在则上传产物（--clobber 覆盖同名 asset），不存在则创建。
        # 处理重打 tag 触发 release.yml 时上一次 run 已创建 release 的冲突场景。
        # release job 无 actions/checkout（无 .git 目录），gh 无法从 git remote 推断
        # owner/repo，必须用 GH_REPO 环境变量显式指定仓库。
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，上传产物（覆盖同名 asset）..."
            gh release upload "$TAG_NAME" release-files/* --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes \
              release-files/*
          fi

      - name: Report failure (if any upstream job failed)
        if: contains(needs.pypi.result, 'failure') || contains(needs.pack-windows.result, 'failure') || contains(needs.pack-linux.result, 'failure')
        run: |
          echo "::error::部分 job 失败（pypi=${{ needs.pypi.result }} windows=${{ needs.pack-windows.result }} linux=${{ needs.pack-linux.result }}），已成功的产物已上传到 Release。"
          exit 1
