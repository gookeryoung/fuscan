[package]
name = "fuscan-core"
version = "0.1.0"
edition = "2021"
description = "Rust + PyO3 原生引擎，释放 GIL 加速 fuscan 扫描（正则匹配/编码检测/OLE 解析）"
license = "MIT"
repository = "https://github.com/gooker_young/fuscan"
keywords = ["regex", "pyo3", "scanner", "gil", "encoding"]
categories = ["text-processing"]

[lib]
name = "fuscan_core"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310：绑定 CPython 3.10 稳定 ABI（PEP 384），构建单一 wheel 覆盖 Python 3.10+。
# 收益：构建量从 N 版本 × M 平台降为 1 × M 平台；PyPI wheel 数减少，覆盖更广。
# 限制：不能用 CPython 版本特定 API；fuscan-core 仅用基础类型，完全兼容。
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py310"] }
regex = "1.11"
regex-syntax = "0.8"
# 编码检测+解码：替代 Python charset-normalizer，释放 GIL 实现并行解码。
# encoding_rs：WHATWG Encoding Standard 实现，零拷贝 UTF-8/ASCII 快路径。
# chardetng：Mozilla 统计编码检测器（用于非 BOM/非 UTF-8 字节的编码猜测）。
encoding_rs = "0.8"
chardetng = "0.1"
# OLE 复合文档解析：替代 Python olefile 的 OLE 流读取，释放 GIL 实现并行解析。
# cfb：MS-CFB 格式实现（DOC/PPT 等 OLE 复合文档），纯 Rust，支持流读取与树遍历。
cfb = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
