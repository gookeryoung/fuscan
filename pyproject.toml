[project]
authors = [{ name = "gooker_young", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "PySide2>=5.15.2.1; python_version <= '3.10'",
    "PySide6>=6.5.0; python_version >= '3.11'",
    "PyYAML>=6.0",
    "typing-extensions>=4.0; python_version < '3.13'",
    "lxml>=4.9.0",
    "pdf_oxide>=0.3",
    "pypdfium2>=4.0",
    "rarfile>=4.1",
    "charset-normalizer>=3.3.0",
    "olefile>=0.46",
    "py7zr>=0.20.0,<1.0.0",
    "reportlab>=4.0.0",
    "python-calamine==0.8.2",
    "orjson>=3.9.0",
]

description     = "极速通用文件扫描器."
license         = "MIT"
name            = "fuscan"
readme          = "README.md"
requires-python = ">=3.10"
version         = "0.2.15"

[project.optional-dependencies]
dev = [
    "fuscan[lint,perf,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
# perf：启动性能汇总表（rich 惰性导入，缺失时回退纯文本），核心库不强依赖
perf = ["rich>=13.0.0"]
test = [
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
fuscanc = "fuscan.cli:main"
fuscan = "fuscan.app:main"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/fuscan"]

[tool.hatch.build.targets.wheel.force-include]
"src/fuscan/py.typed" = "fuscan/py.typed"
"src/fuscan/assets/docs/fuscan-用户手册.pdf" = "fuscan/assets/docs/fuscan-用户手册.pdf"
"src/fuscan/gui/resources_rc.py" = "fuscan/gui/resources_rc.py"
"src/fuscan/gui/resources.qrc" = "fuscan/gui/resources.qrc"
"src/fuscan/gui/qtquickcontrols2.conf" = "fuscan/gui/qtquickcontrols2.conf"

[tool.fspack]
include = ["rules"]
exclude = [".trae", ".github", ".benchmarks", "tests", "docs", "scripts"]
pyc_strip = true
no_site = true

[tool.fspack.entries]
fuscan = "src/fuscan/app.py"

[dependency-groups]
dev = ["fuscan[dev]"]
