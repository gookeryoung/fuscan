[project]
authors = [{ name = "gooker_young", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "PySide2>=5.15.2.1; python_version <= '3.10'",
    "PySide6>=6.5.0; python_version >= '3.11'",
    "PyYAML>=6.0",
    "typing-extensions>=4.0; python_version < '3.13'",
    "lxml>=4.9.0",
    "pypdfium2>=4.0",
    "rarfile>=4.1",
    "charset-normalizer>=3.3.0",
    "olefile>=0.46",
    "py7zr>=0.20.0,<1.0.0",
    "reportlab>=4.0.0",
    "python-calamine==0.8.2",
    "orjson>=3.9.0",
    "watchdog>=3.0.0",
]

description     = "极速通用文件扫描器."
license         = "MIT"
name            = "fuscan"
readme          = "README.md"
requires-python = ">=3.10"
version         = "0.3.6"

[project.optional-dependencies]
dev = [
    "fuscan[lint,perf,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
# native：Rust + PyO3 原生匹配引擎，缺失时回退纯 Python 路径（语义等价）
# pip install fuscan[native] 获得原生加速；pip install fuscan 走纯 Python
native = ["fuscan-core>=0.1.0"]
# ocr：图片 OCR + 扫描版 PDF OCR 回退。
# OCR 引擎为 RapidOCR-json 预编译 exe（C++ 静态链接 onnxruntime+opencv，单文件 16MB，
# 无外部 DLL，兼容 Win7 x64），随软件内置分发（非 pip 依赖，见 fspack data-dirs），
# 绕过 Python onnxruntime wheel 的 Win7 兼容性死结。
# Pillow 仅用于扫描版 PDF OCR 回退时将渲染页保存为 PNG 字节喂 exe；缺失时 PDF OCR
# 回退静默降级（图片 OCR 不依赖 Pillow——exe 内部 opencv 解码图片字节）。
ocr = [
    "Pillow>=10.0.0",
]
# perf：启动性能汇总表（rich 惰性导入，缺失时回退纯文本），核心库不强依赖
perf = ["rich>=13.0.0"]
test = [
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
fuscan = "fuscan.app:main"
fuscanc = "fuscan.cli:main"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# uv workspace：fuscan-core 作为本地 workspace 成员，uv sync 自动从源码构建
# （需 Rust 工具链）。避免 maturin develop 安装的 editable 包被 uv sync 移除。
# fuscan-core 是可选运行时依赖（缺失时回退纯 Python），dev group 声明用于本地开发
# 与测试；CI test job 用 --extra test 不含 dev，native 测试自动 skipif 跳过。
[tool.uv.workspace]
members = ["packages/fuscan-core"]

[tool.uv.sources]
fuscan-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fuscan"]

[tool.hatch.build.targets.wheel.force-include]
"src/fuscan/py.typed" = "fuscan/py.typed"
"src/fuscan/assets/manual/fuscan-用户手册.pdf" = "fuscan/assets/manual/fuscan-用户手册.pdf"
"src/fuscan/gui/resources_rc.py" = "fuscan/gui/resources_rc.py"
"src/fuscan/gui/resources.qrc" = "fuscan/gui/resources.qrc"
"src/fuscan/gui/qtquickcontrols2.conf" = "fuscan/gui/qtquickcontrols2.conf"

# sdist 防御性 exclude：即使 .gitignore 漏排，也不把 Rust 编译产物 / 子包
# 构建产物打入源码包。hatchling sdist 默认按 VCS 跟踪文件，此处显式 exclude
# 双保险，避免 500MB+ target/ 污染 PyPI sdist。
[tool.hatch.build.targets.sdist]
exclude = [
    "packages/fuscan-core/target",
    "packages/fuscan-core/dist",
    "packages/fuscan-core/.venv*",
    "packages/fuscan-core/Cargo.lock",
    # OCR 引擎 exe（16MB）与 PP-OCRv3 模型文件（~14MB）已入仓但不进 sdist/wheel，
    # 避免源码包体积膨胀；二者随 fspack 便携包离线分发（见 [tool.fspack] data-dirs）。
    "src/fuscan/assets/ocr/RapidOCR-json.exe",
    "src/fuscan/assets/ocr/models/*.onnx",
    "src/fuscan/assets/ocr/models/ppocr_keys_v1.txt",
]

[tool.fspack]
extras = ["native", "ocr"]
exclude = [".*", "tests", "benchmarks", "docs", "scripts", "packages"]
# OCR 引擎 exe（RapidOCR-json.exe）与 PP-OCRv3 模型文件为非 .py 数据文件，
# 显式声明数据目录确保 fspack 源码拷贝阶段原样保留（pyc_strip 跳过其下 .pyc 剥离）；
# 二者已入仓，fspack 直接从源码拷贝，运行时由 importlib.resources.files("fuscan.assets.ocr") 加载。
data-dirs = ["src/fuscan/assets/ocr", "src/fuscan/assets/ocr/models"]
pyc_strip = true
no_site = true
# fuscan-core 未发布到 PyPI，CI 中用 maturin 本地构建 wheel 到 fuscan-core-wheels/，
# fspack 通过 find-links 从本地目录解析 fuscan-core 依赖，避免 PyPI 下载失败。
find-links = ["fuscan-core-wheels"]

[tool.fspack.entries]
fuscan = "src/fuscan/app.py"

[dependency-groups]
dev = ["fuscan[dev]", "fuscan-core"]
