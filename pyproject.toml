[project]
authors = [{ name = "gooker_young", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "PySide2>=5.15.2.1; python_version <= '3.10'",
    "PySide6>=6.5.0; python_version >= '3.11'",
    "PyYAML>=6.0",
    "typing-extensions>=4.0; python_version < '3.13'",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    # lxml 是 python-docx/pptx 的传递依赖，但 _odf_xml.py 与 _ooxml_xml.py 直接依赖
    # lxml.etree 做 XML 解析（XPath C 层匹配 / iterparse 流式），故显式声明
    "lxml>=4.9.0",
    "pypdf>=4.0.0",
    "pdf_oxide>=0.3",
    "rarfile>=4.1",
    "charset-normalizer>=3.3.0",
    "striprtf>=0.0.26",
    "olefile>=0.46",
    "extract-msg>=0.48.0,<0.56",
    # py7zr 1.x 移除了 readall()/read() API（改用 extract 写入磁盘），
    # 与 SevenZReader 的 read(targets) 惰性读取方案冲突；
    # iter-126 已将 readall() 预读改为 read(targets) 按需读取，但 1.x 完全移除 read，
    # 故仍锁定 0.x 直到迁移到 extract+临时目录方案。
    "py7zr>=0.20.0,<1.0.0",
    "reportlab>=4.0.0",
    # iter-126：迁移 Python 3.10 后统一使用 python-calamine 0.8.2（更高性能）
    "python-calamine==0.8.2",
    "orjson>=3.9.0",
    "kreuzberg>=4.10.0",
]

description     = "极速通用文件扫描器."
license         = "MIT"
name            = "fuscan"
readme          = "README.md"
requires-python = ">=3.10"
version         = "0.2.3"

[project.optional-dependencies]
dev = [
    "fuscan[lint,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "openpyxl>=3.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]

[project.scripts]
fuscanc = "fuscan.cli:main"
fuscan = "fuscan.gui.app:launch"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/fuscan"]

[tool.hatch.build.targets.wheel.force-include]
"src/fuscan/py.typed" = "fuscan/py.typed"
"src/fuscan/assets/docs/fuscan-用户手册.pdf" = "fuscan/assets/docs/fuscan-用户手册.pdf"
"src/fuscan/gui/resources_rc.py" = "fuscan/gui/resources_rc.py"
"src/fuscan/gui/resources.qrc" = "fuscan/gui/resources.qrc"
"src/fuscan/gui/qtquickcontrols2.conf" = "fuscan/gui/qtquickcontrols2.conf"

[tool.fspack.entries]
fuscan = "src/fuscan/gui/__main__.py"

[dependency-groups]
dev = ["fuscan[dev]"]
