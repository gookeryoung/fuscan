# 安全审计规则集
# 场景：扫描代码与配置中的硬编码密钥、凭证、私钥等敏感信息
# 适用：上线前安全检查、CI/CD 集成、代码审计
#
# 注：AWS Access Key / PEM 私钥 / 通用私钥头 / JWT / GitHub Token / 硬编码密码赋值 /
# 数据库连接串密码已由内置 builtin.yaml（P0101 / P0102 / P0201-P0205）与
# templates（database_connection_strings / common_credentials）覆盖。
# 本文件聚焦：AND + NOT path 组合的教学演示——在非测试目录中检测特定模式的凭证。
version: "1.0"

# 路径级 glob 过滤：排除第三方依赖与构建产物（相对扫描根目录）。
ignore_paths:
  - "*/vendor/*"
  - "*/node_modules/*"
  - "*/third_party/*"
  - "*/dist/*"
  - "*/build/*"

# 目录名级忽略：测试数据目录。
ignore_dirs:
  - "testdata"
  - "mock-data"

# 文件后缀白名单：源代码 + 配置文件 + 纯文本/日志（凭证常出现的位置）。
# 注：以下后缀大部分由 SourceCodeExtractor 处理，默认禁用，需在「设置 → 文件类型」启用。
scan_extensions:
  # 源代码
  - "py"
  - "js"
  - "ts"
  - "java"
  - "go"
  - "rs"
  - "c"
  - "cpp"
  - "cs"
  - "php"
  - "rb"
  - "sh"
  # 配置文件
  - "env"
  - "yaml"
  - "yml"
  - "json"
  - "ini"
  - "conf"
  - "toml"
  - "properties"
  # 纯文本/日志
  - "txt"
  - "log"

# 扫描参数：凭证扫描 CPU 轻量，可提高并发线程数。
scan_params:
  max_workers: 8
  cache_enabled: true

# 误报白名单：文档中的格式示例（明确标记的假阳性）。
whitelist:
  - path_glob: "*/examples/*.md"
    rule_name: "AWS Secret Key 疑似泄露"
    note: "文档中的 AWS Secret Key 格式示例"
    source: "rules"

rules:
  # AWS Secret Access Key（40 位 base64 字符，启发式）
  # 教学演示：AND + NOT path 组合——CONTENT 命中后排除路径含 "test" 的文件。
  - name: AWS Secret Key 疑似泄露
    description: 检测疑似 AWS Secret Access Key 的 40 位字符串
    severity: critical
    match:
      type: and
      children:
        - type: content
          mode: regex
          pattern: 'aws_secret_access_key\s*[=:]\s*[''"]?[A-Za-z0-9/+=]{40}[''"]?'
        - type: not
          child:
            type: path
            mode: contains
            pattern: test
            case_sensitive: false

  # 排除测试目录中的密码赋值
  # 教学演示：AND + NOT path 组合——CONTENT 命中后排除 test/tests/__tests__/spec 目录。
  - name: 非测试目录的硬编码密码
    description: 检测非测试目录中的硬编码密码赋值
    severity: warning
    match:
      type: and
      children:
        - type: content
          mode: regex
          pattern: '(password|passwd|pwd)\s*[=:]\s*[''"][^''"]{4,}[''"]'
          case_sensitive: false
        - type: not
          child:
            type: path
            mode: regex
            pattern: '(test|tests|__tests__|spec)/'
            case_sensitive: false
