# 敏感数据检测规则集
# 场景：扫描文档/代码/配置中泄露的个人敏感信息（PII）
# 适用：金融、医疗、政府等行业的合规扫描
#
# 注：身份证号 / 手机号 / 邮箱地址已由内置 templates.privacy_data 模板覆盖。
# 本文件聚焦：银行卡号（内置未覆盖）+ AND 组合（按文件类型限定扫描）的教学演示。
version: "1.0"

# 路径级 glob 过滤（相对扫描根目录，大小写不敏感）。
# 与内置 builtin.yaml 的 ignore_paths 取并集。
ignore_paths:
  - "*/tests/*"
  - "*/examples/*"
  - "*/fixtures/*"
  - "*/mock/*"

# 目录名级忽略（任意层级、大小写不敏感），与内置 ignore_dirs 取并集。
ignore_dirs:
  - "testdata"
  - "mock-data"
  - "samples"

# 文件后缀白名单（小写、无前导点）。
# 非空列表覆盖内置全选默认，仅扫描 PII 常见载体（文档/表格/日志/邮件）。
# 注：csv 由 SourceCodeExtractor 处理，默认禁用，需在「设置 → 文件类型」启用。
scan_extensions:
  - "txt"
  - "log"
  - "csv"
  - "pdf"
  - "docx"
  - "xlsx"
  - "pptx"
  - "doc"
  - "xls"
  - "ppt"
  - "eml"

# 扫描参数（字段级覆盖：非 null 字段覆盖内置默认值）。
# 大文件阈值降到 20MB，避免大日志/表格拖慢 PII 扫描。
scan_params:
  max_file_size: 20971520  # 20 * 1024 * 1024
  cache_enabled: true

# 误报白名单（path_glob + rule_name + 备注），与内置 whitelist 取并集。
# 示例：测试夹具中固定假阳性手机号。
whitelist:
  - path_glob: "*/tests/fixtures/*.csv"
    rule_name: "日志文件中的手机号"
    note: "测试夹具中的假阳性手机号"
    source: "rules"

rules:
  # 银行卡号（16-19 位连续数字，简单启发式）
  # 注：内置 templates.privacy_data 未覆盖银行卡号，本规则填补该空白。
  - name: 银行卡号泄露
    description: 检测 16-19 位连续数字（疑似银行卡号）
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '(?<!\d)\d{16,19}(?!\d)'
      case_sensitive: false

  # 仅扫描 .log/.csv/.txt 中的手机号（避免误报）
  # 教学演示：AND 组合器 + FILENAME 子规则按文件类型限定 CONTENT 扫描范围。
  - name: 日志文件中的手机号
    description: 仅在日志/CSV/文本文件中检测手机号，降低误报率
    severity: warning
    match:
      type: and
      children:
        - type: filename
          mode: regex
          pattern: '\.(log|csv|txt)$'
        - type: content
          mode: regex
          pattern: '(?<!\d)1[3-9]\d{9}(?!\d)'
