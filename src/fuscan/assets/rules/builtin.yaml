# fuscan 内置通用规则
#
# 此文件随软件分发，提供通用的过滤与识别规则以及默认扫描配置。
# 用户规则文件中同名规则会覆盖此处对应的规则；
# ignore_paths/ignore_dirs 取并集；scan_extensions/scan_params 由后者非空覆盖；
# whitelist 取并集（按 path_glob + rule_name 去重）。
version: "1.0"

# 路径级 glob 过滤（相对扫描根目录，大小写不敏感）
ignore_paths:
  - "*/vendor/*"
  - "*/.cache/*"
  - "*/third_party/*"
  - "*/.venv*/*"

# 目录名级忽略（按目录名匹配任意层级，大小写不敏感）。
# 默认值从历史 IGNORE_DIR_CATEGORIES 扁平化派生，涵盖：
# 版本控制 / 语言工具链缓存 / 构建输出 / IDE 配置 / 临时日志 /
# 大型软件安装目录（ANSYS/AutoCAD/SolidWorks/Office/WPS/MATLAB/Adobe 等）/
# Windows 系统目录 / fuscan 缓存。
# 用户可在 ``~/.fuscan/rules/user-scan.yaml`` 中追加自定义 ignore_dirs（取并集）。
ignore_dirs:
  # 版本控制
  - ".git"
  - ".svn"
  - ".hg"
  # Python
  - "__pycache__"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".venv"
  - "venv"
  - "env"
  - ".tox"
  - ".eggs"
  # Node / JavaScript
  - "node_modules"
  - ".sass-cache"
  - ".npm"
  - ".yarn"
  - ".pnpm-store"
  - ".next"
  - ".nuxt"
  - ".turbo"
  - ".parcel-cache"
  - ".svelte-kit"
  # Rust / Cargo
  - "target"
  - ".cargo"
  - ".rustup"
  # Java
  - ".gradle"
  - ".m2"
  - ".ivy"
  # .NET / Visual Studio
  - ".vs"
  - "packages"
  - ".nuget"
  # PHP
  - "vendor"
  # Apple
  - "Pods"
  - "DerivedData"
  # Flutter / Dart
  - ".dart_tool"
  # 构建输出
  - "dist"
  - "build"
  - "out"
  # IDE
  - ".idea"
  - ".vscode"
  # 缓存 / 临时 / 日志
  - ".cache"
  - "tmp"
  - "temp"
  - "logs"
  - "log"
  - ".Trash"
  - "Trash"
  # 大型软件
  - "ANSYS Inc"
  - "Autodesk"
  - "SOLIDWORKS Corp"
  - "SolidWorks"
  - "Microsoft Office"
  - "Office16"
  - "Office15"
  - "Office14"
  - "Kingsoft"
  - "WPS Office"
  - "MATLAB"
  - "MathWorks"
  - "Adobe"
  - "Corel"
  - "TecPlot"
  - "STK"
  - "Altium"
  - "JetBrains"
  - "IntelliJ IDEA"
  - "PyCharm"
  - "WebStorm"
  - "CLion"
  - "GoLand"
  - "Rider"
  - "PhpStorm"
  - "DataGrip"
  - "AppCode"
  - "Android Studio"
  - "FreeCAD"
  - "PTC"
  - "Creo"
  - "Siemens"
  - "Dassault Systemes"
  - "Bentley"
  - "Inventor"
  - "Revit"
  - "SketchUp"
  - "McNeel"
  - "Rhino"
  - "Affinity"
  - "Serif"
  - "Blackmagic Design"
  - "National Instruments"
  - "LabVIEW"
  - "Maplesoft"
  - "Wolfram Research"
  - "Eclipse"
  - "Microsoft Visual Studio"
  - "Microsoft SQL Server"
  # Windows 系统目录
  - "Program Files"
  - "Program Files (x86)"
  - "Windows"
  - "WinSxS"
  - "ProgramData"
  - "System Volume Information"
  - "$Recycle.Bin"
  # fuscan
  - ".fuscan-cache"

# 文件后缀白名单（小写、无前导点）。
#   - null（未指定）= 全选默认（所有注册提取器支持的后缀）
#   - 空 list = 都不扫描
#   - 非空 list = 仅扫描指定后缀
# 默认值 = 所有注册提取器扩展名 - 默认禁用项（SourceCodeExtractor + SevenZArchiveExtractor）
# 即：仅扫描纯文本/PDF/Office（DOCX/PPTX/XLSX/ODS/ODT/WPS/EML/XLS/DOC/PPT）+ ZIP/RAR 压缩包。
# 用户可在 user-scan.yaml 中提供完整列表覆盖此默认（后者非 null 覆盖前者）。
scan_extensions:
  - "txt"
  - "log"
  - "pdf"
  - "docx"
  - "pptx"
  - "xlsx"
  - "xlsm"
  - "ods"
  - "odt"
  - "wps"
  - "et"
  - "dps"
  - "eml"
  - "xls"
  - "doc"
  - "ppt"
  - "zip"
  - "rar"

# 扫描参数默认值（用户可在 user-scan.yaml 中按字段覆盖）。
#   - max_workers: 默认 5（PyO3 提取器释放 GIL，5 线程改善 I/O 并行度）
#   - max_depth: null = 无限深度
#   - max_file_size: 50MB（超过此值的文件不读取内容，避免独占 GIL 冻结界面；0=不限制）
#   - scan_archives: true（启用压缩包扫描）
#   - cache_enabled: true（启用内容哈希缓存，二次扫描加速）
#   - perf_log_enabled: false（性能日志默认关闭）
scan_params:
  max_workers: 5
  max_depth: null
  max_file_size: 52428800  # 50 * 1024 * 1024
  scan_archives: true
  cache_enabled: true
  perf_log_enabled: false

# 误报白名单（路径 glob + 规则名 + 备注）。
# 内置规则不预定义任何误报条目；用户运行时标记的误报通过 WhitelistController
# 追加到 user-scan.yaml 的 whitelist 段（source: "runtime"）。
whitelist: []

rules:
  # ---------- 敏感个人信息(PRIVATE INFO) ----------
  - name: P0101-私钥文件头
    description: 检测 PEM 格式私钥文件头（RSA/EC/DSA/OPENSSH/PGP）
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+|OPENSSH\s+|PGP\s+)?PRIVATE\s+KEY-----'
  - name: P0102-通用密码赋值
    description: 检测配置文件中的密码赋值语句
    severity: warning
    match:
      type: content
      mode: regex
      pattern: '(?i)(password|passwd|pwd)\s*[=:]\s*\S+'
  - name: P0103-敏感配置文件名
    description: 检测常见敏感配置文件名
    severity: info
    match:
      type: filename
      mode: regex
      pattern: '(?i)(^\.env$|^\.env\.|^credentials|^secrets\.|\.pem$|\.key$|\.pfx$|\.keystore$)'
  - name: P0104-邮件信息包含敏感词
    description: 检测邮件信息包含敏感词
    severity: critical
    match:
      type: and
      children:
        - type: filename
          mode: regex
          pattern: '(?i)(^\.eml$)'
        - type: content
          mode: regex
          pattern: '(价格|内部|商业|薪酬)'

  # ---------- 凭证与密钥（CREDENTIALS） ----------
  # 扩展内置凭证模式覆盖 10+ 类常见密钥格式
  # AWS Access Key ID（20 位字母数字，以 AKIA/ASIA/AGPA/AIDA/AROA/AIPA/ANPA/ANVA 开头）
  - name: P0201-AWS-Access-Key-ID
    description: 检测 AWS Access Key ID（AKIA/ASIA 等前缀 + 17 位字母数字）
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '\b(AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA)[A-Z0-9]{16}\b'
  # AWS Secret Access Key（40 位 base64 字符，紧随 access key 后或独立出现）
  - name: P0202-AWS-Secret-Access-Key
    description: 检测 AWS Secret Access Key（40 位 base64 字符）
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '(?i)aws_secret_access_key\s*[=:]\s*[A-Za-z0-9/+=]{40}'
  # GitHub Token（ghp_/gho_/ghu_/ghs_/ghr_/github_pat_ 前缀 + 36+ 位 base62）
  - name: P0203-GitHub-Token
    description: 检测 GitHub Personal Access Token（ghp_/github_pat_ 等前缀）
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b|\bgithub_pat_[A-Za-z0-9_]{82,}\b'
  # Slack Token（xoxb-/xoxp-/xoxa-/xoxr- 前缀 + 10+ 位 base64）
  - name: P0204-Slack-Token
    description: 检测 Slack Token（xoxb-/xoxp-/xoxa-/xoxr- 前缀）
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '\bxox[abpr]-[A-Za-z0-9-]{10,72}\b'
  # JWT（三段 base64url，以 eyJ 开头）
  - name: P0205-JWT
    description: 检测 JSON Web Token（eyJ 开头的三段式 base64url）
    severity: warning
    match:
      type: content
      mode: regex
      pattern: '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'
  # Stripe Key（sk_live_/rk_live_/sk_test_/rk_test_ 前缀 + 24+ 位字符）
  - name: P0206-Stripe-Key
    description: 检测 Stripe API 密钥（sk_live_/rk_live_ 等前缀）
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '\b(sk|rk)_(live|test)_[A-Za-z0-9]{24,}\b'
  # GCP API Key（AIza 前缀 + 35 位字符）
  - name: P0207-GCP-API-Key
    description: 检测 Google Cloud Platform API Key（AIza 前缀）
    severity: warning
    match:
      type: content
      mode: regex
      pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
  # Azure SAS Token（sv=...&ss=...&sig=... 形式）或 Storage Connection String
  - name: P0208-Azure-SAS-Token
    description: 检测 Azure Shared Access Signature（含 sig= 签名参数）
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '(?i)sig=[A-Za-z0-9%+/=]{20,}.*(sv=|st=|se=|sr=|sp=)'
  # Azure Connection String（AccountKey= 后跟 base64）
  - name: P0209-Azure-Connection-String
    description: 检测 Azure Storage Connection String 中的 AccountKey
    severity: critical
    match:
      type: content
      mode: regex
      pattern: '(?i)accountkey=[A-Za-z0-9+/=]{50,}'
  # 通用 API Key / Bearer Token 赋值
  - name: P0210-Generic-API-Key
    description: 检测通用 API Key / Bearer Token 赋值语句
    severity: warning
    match:
      type: content
      mode: regex
      pattern: '(?i)(api[_-]?key|access[_-]?token|auth[_-]?token)\s*[=:]\s*[A-Za-z0-9_\-./+=]{20,}|bearer\s+[A-Za-z0-9_\-./+=]{20,}'
